<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anas Profile</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            --bg: #020617;
            --neon-blue: #00d2ff;
            --neon-purple: #9d50bb;
            --card-bg: rgba(15, 23, 42, 0.5); 
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #020617; 
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .container { 
            max-width: 500px; 
            margin: auto; 
            position: relative; 
            z-index: 2;
        }

        @keyframes spaceFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(0.5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        @keyframes itemReveal {
            0% { opacity: 0; transform: translateY(40px) scale(0.9); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        .header { text-align: center; margin: 40px 0; animation: itemReveal 1s ease forwards; }
        h1 { font-size: 3.5rem; margin: 0; color: #fff; text-shadow: 0 0 15px var(--neon-blue); }

        .link-card, .blog-item {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 210, 255, 0.15);
            margin: 20px 0;
            border-radius: 15px;
            opacity: 0;
            animation: itemReveal 0.8s ease forwards, spaceFloat 4s ease-in-out infinite;
        }

        .link-card { padding: 18px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #fff; cursor: pointer; }
        
        .blog-item { border-color: rgba(157, 80, 187, 0.3); position: relative; }
        .blog-header { padding: 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        
        .downloads-count {
            font-size: 0.7rem;
            background: rgba(157, 80, 187, 0.2);
            padding: 2px 8px;
            border-radius: 10px;
            color: var(--neon-purple);
            border: 1px solid rgba(157, 80, 187, 0.3);
        }

        .blog-content { 
            max-height: 0; 
            overflow-y: auto; 
            transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
            padding: 0 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-purple) transparent;
        }

        .blog-content::-webkit-scrollbar { width: 4px; }
        .blog-content::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 10px; }

        .blog-content.active { 
            max-height: 350px; 
            padding: 10px 20px 25px; 
            border-top: 1px solid rgba(157,80,187,0.1); 
        }

        .blog-desc { line-height: 1.8; font-size: 0.9rem; color: #cbd5e1; white-space: pre-wrap; }
        
        .btn-link {
            display: block;
            width: 100%;
            text-align: center;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            color: white;
            padding: 10px;
            margin-top: 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
        }

        #audio-status {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(0, 210, 255, 0.2);
            padding: 10px; border-radius: 50%; cursor: pointer;
            z-index: 10; border: 1px solid var(--neon-blue);
        }
    </style>
</head>
<body onclick="startSpaceSound()">

    <div id="audio-status" onclick="toggleMute()"><i class="fa-solid fa-volume-high"></i></div>

    <div class="container">
        <div class="header">
            <h1>أنس</h1>
            <div style="color: var(--neon-blue); letter-spacing: 3px; font-size: 0.8rem;">مطور ألعاب وتطبيقات أندرويد ومواقع الويب...</div>
        </div>
        
        <div id="linksContainer"></div>
        <h3 style="color:var(--neon-purple); text-align:center; margin-top:40px;"><i class="fa-solid fa-rocket"></i> المدونات</h3>
        <div id="blogsContainer"></div>
    </div>

    <script>
        // إعدادات قاعدة البيانات الخاصة بك
        const config = { databaseURL: "https://anasportfolio-c3316-default-rtdb.europe-west1.firebasedatabase.app" };
        firebase.initializeApp(config);
        const db = firebase.database();

        let audio = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3');
        audio.loop = true;
        let isStarted = false;

        function startSpaceSound() { if(!isStarted) { audio.play(); isStarted = true; } }
        function toggleMute() {
            audio.muted = !audio.muted;
            document.getElementById('audio-status').innerHTML = audio.muted ? 
                '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
        }

        function linkify(text) {
            const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
            return text.replace(urlPattern, '<a href="$1" target="_blank" style="color:var(--neon-blue); text-decoration:underline;">$1</a>');
        }

        // دالة لزيادة عدد التحميلات الحقيقية عند الضغط على الزر
        function registerClick(type, id) {
            db.ref(`${type}/${id}/clicks`).transaction((currentClicks) => {
                return (currentClicks || 0) + 1;
            });
        }

        db.ref('/').on('value', (snapshot) => {
            const data = snapshot.val();
            
            // عرض الروابط (Links)
            let lHtml = '';
            if(data?.links) {
                let i = 0;
                Object.keys(data.links).reverse().forEach(id => {
                    const l = data.links[id];
                    lHtml += `<div onclick="registerClick('links', '${id}'); window.open('${l.url}', '_blank')" class="link-card" style="animation-delay: ${i * 0.2}s">
                        <span><i class="fa-solid fa-bolt" style="color:var(--neon-blue); margin-left:10px"></i> ${l.title}</span>
                        <i class="fa-solid fa-chevron-left"></i>
                    </div>`;
                    i++;
                });
            }
            document.getElementById('linksContainer').innerHTML = lHtml;

            // عرض المدونات (Blogs) مع دمج الأرقام الفيك والحقيقية
            let bHtml = '';
            if(data?.blogs) {
                let j = 0;
                Object.keys(data.blogs).reverse().forEach(id => {
                    const b = data.blogs[id];
                    
                    // هنا السحر: نجمع الحقيقي + الفيك اللي بتبعتهم من كود الكنترول
                    const totalDownloads = (parseInt(b.clicks) || 0) + (parseInt(b.fakeClicks) || 0);

                    bHtml += `
                    <div class="blog-item" style="animation-delay: ${(j * 0.2) + 0.6}s">
                        <div class="blog-header" onclick="toggleBlog('${id}')">
                            <div style="display:flex; flex-direction:column; gap:5px">
                                <h4><i class="fa-solid fa-terminal" style="color:var(--neon-purple)"></i> ${b.title}</h4>
                                <span class="downloads-count"><i class="fa-solid fa-download"></i> ${totalDownloads} التحميلات</span>
                            </div>
                            <i class="fa-solid fa-plus" id="icon-${id}" style="transition:0.3s"></i>
                        </div>
                        <div class="blog-content" id="content-${id}">
                            <div class="blog-desc">${linkify(b.desc)}</div>
                            ${b.url ? `<a href="${b.url}" target="_blank" onclick="registerClick('blogs', '${id}')" class="btn-link"><i class="fa-solid fa-cloud-arrow-down"></i> رابط التحميل / المصدر</a>` : ''}
                        </div>
                    </div>`;
                    j++;
                });
            }
            document.getElementById('blogsContainer').innerHTML = bHtml;
        });

        function toggleBlog(id) {
            const content = document.getElementById(`content-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            content.classList.toggle('active');
            icon.style.transform = content.classList.contains('active') ? 'rotate(45deg)' : 'rotate(0deg)';
        }
    </script>

    <script>
        // Three.js Background
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.domElement.style.position = 'fixed';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.zIndex = '-1';
        document.body.appendChild(renderer.domElement);

        const earthGeometry = new THREE.SphereGeometry(3.5, 64, 64);
        const earthMaterial = new THREE.MeshStandardMaterial({ 
            map: new THREE.TextureLoader().load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg') 
        });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        scene.add(earth);

        const light = new THREE.PointLight(0x00d2ff, 1.5, 100);
        light.position.set(5, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        camera.position.z = 12;

        function animate() {
            requestAnimationFrame(animate);
            earth.rotation.y += 0.0015;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
